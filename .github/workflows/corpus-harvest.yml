name: Tesseract corpus harvest
# Acquisition stage of the research corpus: enumerate open-access museum records,
# apply metadata gates (image, provenance, rights, cultural access, relevance),
# deduplicate, and publish the metadata-accepted candidates as an artifact.
on:
  push:
    branches: [claude/tesseract-corpus-harvest]
    paths:
      - "scripts/build-research-corpus.ts"
      - "scripts/analyze-research-corpus.ts"
      - "scripts/corpus/**"
      - ".github/workflows/corpus-harvest.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Metadata-accepted candidates to collect"
        default: "25000"
      sources:
        description: "Comma list to restrict sources (met,aic,cma,vam,si); empty = all"
        default: ""
concurrency:
  group: corpus-harvest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    # Reconnaissance of candidate sources (robots.txt, sitemaps, API samples). Read-only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx@4 scripts/corpus/probe-sources.mts

  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CORPUS_TARGET: ${{ inputs.target || '25000' }}
      CORPUS_SOURCES: ${{ inputs.sources }}
      CORPUS_MAX_MINUTES: "320"
      CORPUS_OUT: out/corpus.ndjson
      CORPUS_REVIEW_OUT: out/corpus-review.ndjson
      CORPUS_SUMMARY_OUT: out/corpus-summary.json
      SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
      DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corpus tests
        run: npx -y tsx@4 --test scripts/corpus/gates.test.ts scripts/corpus/features.test.ts
      - name: Harvest
        run: |
          mkdir -p out
          npx -y tsx@4 scripts/build-research-corpus.ts
      - name: Summary
        if: always()
        run: |
          test -f out/corpus-summary.json && jq 'del(.culture)' out/corpus-summary.json || echo "no summary"
          wc -l out/*.ndjson || true
          gzip -kf out/corpus.ndjson out/corpus-review.ndjson || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-corpus-${{ github.run_id }}
          path: |
            out/corpus.ndjson.gz
            out/corpus-review.ndjson.gz
            out/corpus-summary.json
          retention-days: 90
      - name: Import into research database
        if: env.DATABASE_URL != ''
        env:
          CORPUS_IN: out/corpus.ndjson
        run: |
          npm install --no-audit --no-fund
          npx -y tsx@4 scripts/import-research-corpus.ts

  analyze:
    # Image-analysis stage: download each candidate image, extract structural
    # features, drop failed/low-information/near-duplicate images. Images are
    # analyzed in memory and never stored.
    needs: harvest
    if: always() && needs.harvest.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CORPUS_IN: out/corpus.ndjson
      ANALYZED_OUT: out/analyzed.ndjson
      ANALYSIS_SUMMARY_OUT: out/analysis-summary.json
      ANALYSIS_CONCURRENCY: "24"
      ANALYSIS_MAX_MINUTES: "320"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tesseract-corpus-${{ github.run_id }}
          path: out
      - name: Install image decoder
        run: npm install --no-save --no-audit --no-fund sharp@0.33
      - name: Analyze images
        run: |
          gunzip -kf out/corpus.ndjson.gz
          npx -y tsx@4 scripts/analyze-research-corpus.ts
      - name: Summary
        if: always()
        run: |
          test -f out/analysis-summary.json && cat out/analysis-summary.json || echo "no summary"
          gzip -kf out/analyzed.ndjson || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-analyzed-${{ github.run_id }}
          path: |
            out/analyzed.ndjson.gz
            out/analysis-summary.json
          retention-days: 90
