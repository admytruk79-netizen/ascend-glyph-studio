name: Tesseract Pilot
on:
  push:
    paths:
      - "packages/tesseract-engine/**"
      - ".github/workflows/tesseract-pilot.yml"
  workflow_dispatch:
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck Tesseract
        run: npm run typecheck --workspace=@ascend/tesseract-engine
      - name: Test Tesseract
        run: npm test --workspace=@ascend/tesseract-engine
      - name: Build Tesseract
        run: npm run build --workspace=@ascend/tesseract-engine
      - name: Run pilot production
        run: npm run pilot --workspace=@ascend/tesseract-engine
      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-pilot-output
          path: packages/tesseract-engine/tesseract-pilot-output
          if-no-files-found: warn
