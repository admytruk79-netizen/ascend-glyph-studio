name: World source discovery
on:
  workflow_dispatch:
  push:
    branches: [glyph-studio/3d-semantic-integration]
    paths:
      - 'scripts/discover-world-sources.cjs'
      - '.github/workflows/world-source-discovery.yml'
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enumerate candidate institutional sources
        run: node scripts/discover-world-sources.cjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: world-source-candidates
          path: packages/tesseract-engine/data/generated/world-source-candidates.json
