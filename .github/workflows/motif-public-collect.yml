name: Motif learner — collect public-use motifs
# Every publicly usable (public domain, CC0, CC BY, CC BY-SA) Ukrainian ornament/embroidery image we can reach:
# Neon corpus (read-only), Wikimedia Commons, Art Institute of Chicago, Cleveland Museum of Art. Images are read in
# memory and never stored; review-only motif records are committed to data/motifs/public/. Nothing trains on them
# until a person sets culturalAccess to open.
on:
  push:
    branches: [claude/tesseract-glyph-training-t298iv]
    paths:
      - "scripts/motifs/collect-public-motifs.mts"
      - ".github/workflows/motif-public-collect.yml"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Reading budget in minutes
        default: "150"
concurrency:
  group: motif-public-collect-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        run: npm install --no-save --no-audit --no-fund sharp tsx pg
      - name: Collect and read
        env:
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          COLLECT_MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
        run: npx tsx scripts/motifs/collect-public-motifs.mts
      - name: Filter and rank the review queue
        run: npx tsx scripts/motifs/filter-public-motifs.mts && npx tsx scripts/motifs/rerank-queue.mts
      - name: Commit review records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/motifs/public data/motifs/reviewed || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Collect public-use motif candidates for review (run ${{ github.run_id }})"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
