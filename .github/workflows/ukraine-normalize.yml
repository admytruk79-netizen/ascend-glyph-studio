name: ukraine-normalize
on:
  workflow_dispatch:
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Ukrainian corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: ukraine-corpus-candidates
          path: .corpus-out/ukraine
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/corpus/normalize-ukraine.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ukraine-corpus-normalized
          path: .corpus-out/ukraine/ukraine-normalized.json
