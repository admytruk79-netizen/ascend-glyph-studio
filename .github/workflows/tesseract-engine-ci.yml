name: Tesseract engine CI
on:
  push:
    branches: [main, tesseract-staging]
    paths:
      - "packages/tesseract-engine/**"
      - ".github/workflows/tesseract-engine-ci.yml"
  pull_request:
    paths:
      - "packages/tesseract-engine/**"
permissions:
  contents: read
concurrency:
  group: tesseract-engine-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Full worker verification
        run: npm run verify:tesseract-worker
