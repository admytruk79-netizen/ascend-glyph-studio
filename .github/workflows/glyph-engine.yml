name: glyph-engine-ci
on:
  push:
    branches: [main, ci-integrity-check]
    paths:
      - 'packages/glyph-engine/**'
      - 'packages/tesseract-engine/**'
      - 'apps/web/**'
      - '.github/workflows/glyph-engine.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm --workspace @ascend/glyph-engine run typecheck
      - run: npm --workspace @ascend/glyph-engine test
      - run: npm --workspace @ascend/glyph-studio-web run typecheck
      - run: npm --workspace @ascend/glyph-studio-web run build
