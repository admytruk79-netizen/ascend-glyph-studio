name: Tri culture Tesseract pilot
on:
  workflow_dispatch:
  push:
    branches: [tesseract-staging]
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspace=@ascend/tesseract-engine
      - run: npm run test --workspace=@ascend/tesseract-engine
      - run: npm run build --workspace=@ascend/tesseract-engine
      - run: node packages/tesseract-engine/dist/src/tri-culture-cli.js
      - run: node packages/tesseract-engine/dist/src/ukrainian-band-cli.js
      - run: node packages/tesseract-engine/dist/src/ukrainian-botanical-cli.js
      - run: node packages/tesseract-engine/dist/src/ukrainian-symbiosis-cli.js
      - run: npm run typecheck --workspace=@ascend/stitch-engine
      - run: npm test --workspace=@ascend/stitch-engine
      - run: npx tsx scripts/export-symbiosis-stitches.ts
      - run: npx tsx scripts/analyze-symbiosis-patterns.ts
      - run: |
          python -m venv /tmp/ascend-machine-verifier
          /tmp/ascend-machine-verifier/bin/pip install pyembroidery==1.5.1
          /tmp/ascend-machine-verifier/bin/python scripts/verify-machine-exports.py
      - run: |
          test -s artifacts/tri-culture/report.json
          test -s artifacts/tri-culture/compound-stitch-ir.json
          test -s artifacts/tri-culture/compound-shared-geometry.svg
          test -s artifacts/tri-culture/compound-textile-colour-chart.json
          for element in earth water fire air spirit; do
            test -s "artifacts/tri-culture/${element}-compound.svg"
            test -s "artifacts/tri-culture/${element}-compound-ir.json"
            test -s "artifacts/tri-culture/${element}-colour-chart.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tri-culture-svg
          path: artifacts/tri-culture
      - uses: actions/upload-artifact@v4
        with:
          name: ukrainian-source-bands
          path: artifacts/ukrainian-bands

      - uses: actions/upload-artifact@v4
        with:
          name: ukrainian-botanical
          path: artifacts/ukrainian-botanical

      - uses: actions/upload-artifact@v4
        with:
          name: ukrainian-symbiosis
          path: artifacts/ukrainian-symbiosis

      - uses: actions/upload-artifact@v4
        with:
          name: symbiosis-machine-stitches
          path: artifacts/symbiosis-stitches

      - uses: actions/upload-artifact@v4
        with:
          name: symbiosis-layer-analysis
          path: artifacts/symbiosis-analysis
