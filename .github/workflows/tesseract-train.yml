name: Tesseract training on museum imagery
# Learns from the museum images themselves: CLIP ornament filter and motif-type tags, thread palettes,
# motif elements clustered into a codebook per tradition and Ukrainian region. Images are analysed in
# memory and never stored. Results: artifact tesseract-model-* and Neon (learned_model, research_image_tag).
on:
  push:
    branches: [claude/tesseract-corpus-harvest]
    paths:
      - "scripts/train/**"
      - ".github/workflows/tesseract-train.yml"
  workflow_dispatch:
    inputs:
      per_tradition:
        description: Images per tradition
        default: "600"
concurrency:
  group: tesseract-train-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch master corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p master out
          for id in $(gh run list -R "${{ github.repository }}" --workflow corpus-harvest.yml --status success --limit 30 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "${{ github.repository }}" -n tesseract-master -D master 2>/dev/null; then echo "master from run $id"; break; fi
          done
          test -f master/master.ndjson.gz
      - name: Install model runtime
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@3 sharp pg
      - name: Train
        env:
          MASTER_IN: master/master.ndjson.gz
          TRAIN_PER_TRADITION: ${{ inputs.per_tradition || '600' }}
          TRAIN_MAX_MINUTES: "170"
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
        run: npx -y tsx@4 scripts/train/train-tesseract.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-model-${{ github.run_id }}
          path: out/tesseract-model.json
          retention-days: 90
          if-no-files-found: ignore
