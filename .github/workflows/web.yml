name: web-ci
on:
  pull_request:
  push:
    branches: [main, glyph-engine/diary-approved-package-bridge]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspace=@ascend/glyph-engine
      - run: npm run typecheck --workspace=@ascend/web
      - run: npm test --workspace=@ascend/glyph-engine
      - run: python3 tools/generate_semantic_pattern.py --seed ci --out /tmp/ascend-ci.svg
      - run: test -s /tmp/ascend-ci.svg
