name: Tesseract training on the full corpus
# Learns from every open-access museum image in six parallel shards (CLIP ornament filter and motif tags,
# palettes, motif elements; images analysed in memory, never stored), then merges them into one model.
# Shards write image tags to Neon as they go; the merge writes learned_model.
on:
  push:
    branches: [claude/tesseract-corpus-harvest]
    paths:
      - "scripts/train/**"
      - ".github/workflows/tesseract-train-full.yml"
  workflow_dispatch:
concurrency:
  group: tesseract-train-full-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch master corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p master out
          for id in $(gh run list -R "${{ github.repository }}" --workflow corpus-harvest.yml --status success --limit 30 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "${{ github.repository }}" -n tesseract-master -D master 2>/dev/null; then echo "master from run $id"; break; fi
          done
          test -f master/master.ndjson.gz
      - name: Install model runtime
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@3 sharp pg
      - name: Extract shard ${{ matrix.shard }}
        env:
          MASTER_IN: master/master.ndjson.gz
          TRAIN_MODE: extract
          TRAIN_SHARDS: "6"
          TRAIN_SHARD: ${{ matrix.shard }}
          TRAIN_MAX_MINUTES: "180"
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
        run: npx -y tsx@4 scripts/train/train-tesseract.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: out/shard-*.json.gz
          retention-days: 30
          if-no-files-found: ignore
  merge:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tesseract-shard-*-${{ github.run_id }}
          path: shards
      - name: Install runtime
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@3 sharp pg
      - name: Merge into the model
        env:
          TRAIN_MODE: merge
          SHARDS_IN: shards
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
        run: npx -y tsx@4 scripts/train/train-tesseract.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-model-full-${{ github.run_id }}
          path: out/tesseract-model.json
          retention-days: 90
          if-no-files-found: ignore
