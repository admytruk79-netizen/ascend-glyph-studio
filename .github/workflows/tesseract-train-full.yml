name: Tesseract training on the full corpus
# Learns from every open-access museum image in Neon (research_corpus_object) in six parallel shards (CLIP ornament filter and motif tags,
# palettes, motif elements; images analysed in memory, never stored), then merges them into one model.
# Shards write image tags to Neon as they go; the merge writes learned_model.
on:
  # retrain daily, and after every successful corpus harvest
  workflow_run:
    workflows: ["Tesseract corpus harvest"]
    types: [completed]
  schedule:
    - cron: "41 3 * * *"
  push:
    branches: [claude/tesseract-corpus-harvest]
    paths:
      - "scripts/train/**"
      - ".github/workflows/tesseract-train-full.yml"
  workflow_dispatch:
concurrency:
  group: tesseract-train-full-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  extract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install model runtime
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@3 sharp pg
      - name: Extract shard ${{ matrix.shard }}
        env:
          # every harvested object, straight from Neon (no wait for a harvest's analysis step)
          TRAIN_SOURCE: neon
          TRAIN_MODE: extract
          TRAIN_SHARDS: "6"
          TRAIN_SHARD: ${{ matrix.shard }}
          TRAIN_MAX_MINUTES: "330"
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
        run: npx -y tsx@4 scripts/train/train-tesseract.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: out/shard-*.json.gz
          retention-days: 30
          if-no-files-found: ignore
  merge:
    needs: extract
    # partial shard failures still merge; a cancelled run never does (it would have nothing to merge)
    if: ${{ !cancelled() && needs.extract.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tesseract-shard-*-${{ github.run_id }}
          path: shards
      - name: Install runtime
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@3 sharp pg
      - name: Merge into the model
        env:
          TRAIN_MODE: merge
          SHARDS_IN: shards
          DATABASE_URL: ${{ secrets.TESSERACT_DATABASE_URL }}
        run: npx -y tsx@4 scripts/train/train-tesseract.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tesseract-model-full-${{ github.run_id }}
          path: out/tesseract-model.json
          retention-days: 90
          if-no-files-found: ignore
